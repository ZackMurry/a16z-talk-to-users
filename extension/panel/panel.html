<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="bar">
    <div class="who">
      <span class="name">Agent</span>
      <span class="ctx" id="ctx" aria-live="polite"></span>
    </div>
    <button class="icon" id="newChat" title="New chat" aria-label="New chat"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
    <button class="icon" id="settingsBtn" title="Settings" aria-label="Settings"><svg viewBox="0 0 20 20" aria-hidden="true"><circle class="ring" cx="10" cy="10" r="2.6"/><path d="M10 2.8v2M10 15.2v2M2.8 10h2M15.2 10h2M4.9 4.9l1.4 1.4M13.7 13.7l1.4 1.4M4.9 15.1l1.4-1.4M13.7 6.3l1.4-1.4"/></svg></button>
  </header>

  <main id="log" aria-live="polite" aria-label="Conversation"></main>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="Ask anything…" aria-label="Message"></textarea>
    <button type="submit" class="send" id="send" aria-label="Send"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5M5.5 9.5 10 5l4.5 4.5"/></svg></button>
  </form>

  <section class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <button class="icon" id="sheetBack" aria-label="Back"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12 5 7 10l5 5"/></svg></button>
      <span id="sheetTitle"></span>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </section>

  <script src="agent.bundle.js"></script>
</body>
</html>
